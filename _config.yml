title: 整うデスク
description: 整理整頓とミニマルな道具選びで、心地よくととのうデスクをつくる実用記事メディア。
lang: ja
timezone: Asia/Tokyo

# baseurlはリポジトリ名 totonou-desk に確定済み（承認記録は D:\Claude_Code\AI_DropShipping_Store\research\blog-design-plan.md 冒頭）。
url: "https://yuuminaduki1080.github.io"
baseurl: "/totonou-desk"

permalink: /posts/:slug/

logo: /assets/images/icon.png
image: /assets/images/banner.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - prompts/
  - scripts/
  - docs/
  - CLAUDE.md
  - README.md
  - .github/
