title: 整うデスク
description: 整理整頓とミニマルな道具選びで、心地よくととのうデスクをつくる実用記事メディア。
lang: ja
timezone: Asia/Tokyo

# Organizationサイト（リポジトリ名 totonou-desk-jp.github.io）のためルート直下で配信し、baseurlは空にする。
# 2026-08-20にYuuMinaduki1080/totonou-deskから移管・リネーム（経緯は docs/operations-runbook.md 段階0）。
url: "https://totonou-desk-jp.github.io"
baseurl: ""

permalink: /posts/:slug/

logo: /assets/images/icon.png
image: /assets/images/banner.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - prompts/
  - scripts/
  - docs/
  - CLAUDE.md
  - README.md
  - .github/
